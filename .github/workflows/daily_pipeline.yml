name: TechyUpdates Opportunity Pipeline

on:
  schedule:
    # Runs everyday at 14:15 UTC (7:45 PM IST)
    - cron: '15 14 * * *'
  workflow_dispatch:
    # Allows manual 1-click execution from GitHub Actions UI

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  execute-pipeline:
    name: Ingest, Classify & Broadcast Tech Opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline (Ingestion ➔ Gemini AI ➔ Excel ➔ Telegram)
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_COMMUNITY_CHANNEL_ID: ${{ secrets.TELEGRAM_COMMUNITY_CHANNEL_ID }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python api/trigger.py

      - name: Archive Generated Excel Spreadsheets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-opportunity-workbooks
          path: "*.xlsx"
          retention-days: 30
