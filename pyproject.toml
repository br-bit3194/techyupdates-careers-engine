[project]
name = "techyupdates-careers-engine"
version = "0.1.0"
description = "Automated opportunity ingestion, AI synthesis, and Telegram broadcaster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "openpyxl>=3.1.2",
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[tool.vercel]
entrypoint = "api.trigger:handler"
